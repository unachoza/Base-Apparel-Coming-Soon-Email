<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->

		<link rel="icon" type="image/svg+xml" href="./images/favicon.svg?v=2" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="./style.css" />
		<title>Base Apparel</title>
	</head>
	<body>
		<main>
			<header class="logo">
				<img src="./images/logo.svg" alt="" />
			</header>
			<img class="hero-image-desktop" src="./images/hero-desktop.jpg" alt="clothing model wearing peach top" />
			<img class="hero-image-mobile" src="./images/hero-mobile.jpg" alt="clothing model wearing peach top" />
			<section>
				<div class="title">
					<span>We're</span>
					coming soon
				</div>
				<div class="copy">
					Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with
					announcements and our launch deals.
				</div>
				<!-- <form class="form-animate">
					<input type="email" name="email" id="email" value="" placeholder="Email Address" />
					<button id="submit-button" type="submit">
						<img src="./images/icon-arrow.svg" alt="arrow" />
					</button>
				</form> -->

				<form class="form-animate" id="signup-form">
					<!-- <label for="email">Email address</label> -->

					<input type="email" name="email" id="email" placeholder="Email Address" autocomplete="email" required />

					<!-- <p>Portfolio demo only. No information is collected or stored.</p> -->

					<button type="submit">></button>

					<p id="form-message" role="status" aria-live="polite"></p>
				</form>
				<label class="checkbox-consent">
					<input type="checkbox" name="marketing-consent" required />
					<span> I agree to receive email updates from Base Apparel. </span>
				</label>
				<div class="user-feedback">
					<div class="thank-you-message">Sign up period ended</div>
					<div class="error-message">Please proivide a valid email</div>
				</div>
			</section>
		</main>
		<script src="./script.js"></script>
	</body>
</html>
